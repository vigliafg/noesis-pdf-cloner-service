name: engine-smoke

# Verifica opzionale del motore reale (pesante: ~1,1 GB di dipendenze).
# Non blocca le PR: si lancia a mano o una volta a settimana.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installa uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Installa il motore pdf2zh_next
        run: |
          uv venv --python 3.12 .venv2
          # Lockfile = stesse versioni validate in locale e usate dall'immagine
          # Docker. Niente fallback al manifest: senza pin risolverebbe
          # dipendenze nuove (es. bitstring 5) e romperebbe l'import del motore.
          uv pip install --python .venv2/bin/python -q -r requirements-engine.lock
      - name: Diagnostica installazione
        run: |
          .venv2/bin/python - <<'PY'
          import sys
          from importlib.metadata import version

          import pdf2zh_next

          print(sys.version)
          print(pdf2zh_next.__file__)
          for pkg in ("pdf2zh-next", "babeldoc", "bitstring"):
              try:
                  print(f"{pkg}=={version(pkg)}")
              except Exception as exc:  # noqa: BLE001 - solo diagnostica
                  print(f"{pkg}: non installato ({exc})")
          PY
      - name: Verifica motore
        run: .venv2/bin/pdf2zh_next --version
