name: engine-smoke

# Verifica opzionale del motore reale (pesante: ~1,1 GB di dipendenze).
# Non blocca le PR: si lancia a mano o una volta a settimana.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installa uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Installa il motore pdf2zh_next
        run: |
          uv venv --python 3.12 .venv2
          # Lockfile = stesse versioni validate in locale. Fallback al manifest
          # solo se il lock non è applicabile (es. nuovo runner senza cache).
          uv pip install --python .venv2/bin/python -q -r requirements-engine.lock \
            || uv pip install --python .venv2/bin/python -q -r requirements-engine.txt
      - name: Diagnostica installazione
        run: |
          .venv2/bin/python -c "import sys, pdf2zh_next; print(sys.version); print(pdf2zh_next.__file__)"
          .venv2/bin/python -m pip list 2>/dev/null | grep -iE "pdf2zh|babeldoc" || true
      - name: Verifica motore
        run: .venv2/bin/pdf2zh_next --version
