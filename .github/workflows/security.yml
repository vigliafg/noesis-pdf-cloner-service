name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installa uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Crea venv e installa
        run: |
          uv venv --python 3.12
          uv pip install -q -r requirements.txt pip-audit
      - name: pip-audit (dipendenze del servizio)
        run: uv run --no-sync pip-audit -r requirements.txt || true
