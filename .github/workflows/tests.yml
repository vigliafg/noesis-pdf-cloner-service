name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test dell'applicazione su Linux, macOS e Windows nativi.
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Installa uv
        uses: astral-sh/setup-uv@v5
      - name: Crea venv e installa le dipendenze
        run: |
          uv venv --python 3.12
          uv pip install -q -r requirements.txt pytest httpx
      - name: Test
        run: uv run --no-sync python -m pytest -q

  # L'installer end-to-end: crea venv, config e verifica con `doctor`.
  # Il motore pesante (pdf2zh_next + modelli) è escluso qui: usa --no-engine.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Installa uv
        uses: astral-sh/setup-uv@v5
      - name: Installer (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./noesis install --ci --no-service --skip-warm --no-engine --data-dir "$RUNNER_TEMP/noesis-data"
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\noesis.cmd install --ci --no-service --skip-warm --no-engine --data-dir "$env:RUNNER_TEMP/noesis-data"
      - name: Doctor (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./noesis doctor --data-dir "$RUNNER_TEMP/noesis-data"
      - name: Doctor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\noesis.cmd doctor --data-dir "$env:RUNNER_TEMP/noesis-data"
      - name: Uninstall dry-run (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./noesis uninstall --dry-run --data-dir "$RUNNER_TEMP/noesis-data"
      - name: Uninstall dry-run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\noesis.cmd uninstall --dry-run --data-dir "$env:RUNNER_TEMP/noesis-data"
      - name: Report + link (Linux/macOS, senza --ci)
        if: runner.os != 'Windows'
        run: ./noesis install --no-service --no-engine --skip-warm --no-browser --data-dir "$RUNNER_TEMP/noesis-report"
      - name: Report + link (Windows, senza --ci)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\noesis.cmd install --no-service --no-engine --skip-warm --no-browser --data-dir "$env:RUNNER_TEMP/noesis-report"

  # End-to-end su Windows: servizio (Task Scheduler), firewall scoped, log.
  # I runner windows-latest hanno privilegi di amministratore.
  windows-service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installa uv
        uses: astral-sh/setup-uv@v5
      - name: Install (servizio + report)
        shell: pwsh
        run: .\noesis.cmd install --no-engine --skip-warm --no-browser --data-dir "$env:RUNNER_TEMP\noesis-svc"
      - name: Attività pianificata presente
        shell: pwsh
        run: schtasks /Query /TN noesis-pdf-cloner-service
      - name: Health
        shell: pwsh
        run: |
          Start-Sleep -Seconds 20
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/api/v1/health).Content
      - name: Firewall scoped (--open-firewall)
        shell: pwsh
        run: |
          .\noesis.cmd install --no-engine --skip-warm --no-browser --open-firewall --data-dir "$env:RUNNER_TEMP\noesis-svc"
          netsh advfirewall firewall show rule name="Noesis PDF Cloner 18080"
      - name: Logs
        shell: pwsh
        run: .\noesis.cmd logs -n 5 --data-dir "$env:RUNNER_TEMP\noesis-svc"
      - name: Uninstall
        shell: pwsh
        run: .\noesis.cmd uninstall --all -y --data-dir "$env:RUNNER_TEMP\noesis-svc"
